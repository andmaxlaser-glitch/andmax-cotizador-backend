<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDMAX Laser - Cotizador</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2, h3 { color: #009ee3; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #009ee3; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0082be; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #252525; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; }
        .opciones-envio label { display: block; margin: 10px 0; cursor: pointer; }
        .input-form { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        /* Estilo para el SVG */
        .preview-svg { width: 120px; height: 120px; background: #000; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ANDMAX Laser - Cotizador</h2>
    
    <div id="cotizador">
        <div class="form-group">
            <label>Subir archivo DXF:</label>
            <input type="file" id="fileInput" accept=".dxf">
        </div>
        <div class="form-group">
            <label>Material:</label>
            <select id="materialInput">
                <option value="mdf">MDF</option>
                <option value="acrilico">Acrílico</option>
                <option value="acero_carbono">Acero al Carbono</option>
                <option value="acero_inoxidable">Acero Inoxidable</option>
                <option value="aluminio">Aluminio</option>
            </select>
        </div>
        <div class="form-group">
            <label>Espesor (mm):</label>
            <input type="number" id="espesorInput" value="3" step="0.5">
        </div>
        <button onclick="realizarCotizacion()">Cotizar Archivo</button>
    </div>

    <div id="resultados" style="margin-top: 30px;">
        <h3>Carrito de Cortes</h3>
        <table id="tablaCarrito">
            <thead>
                <tr>
                    <th>Vista</th>
                    <th>Archivo</th>
                    <th>Costo</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="finalizar-pedido" style="margin-top: 40px; border-top: 2px solid #333; padding-top: 20px; display: none;">
        <h3>Seleccioná el método de entrega:</h3>
        <div class="opciones-envio">
            <label><input type="radio" name="tipoEnvio" value="retiro" checked onchange="toggleCamposEnvio()"> Retiro por el taller (Gratis)</label>
            <label><input type="radio" name="tipoEnvio" value="local" onchange="toggleCamposEnvio()"> Envío Local / GBA ($5.000)</label>
            <label><input type="radio" name="tipoEnvio" value="correo" onchange="toggleCamposEnvio()"> Correo Argentino ($12.000)</label>
        </div>

        <div id="seccion-direccion" style="display: none; margin-top: 15px;">
            <input type="text" id="envioNombre" placeholder="Nombre y Apellido" class="input-form">
            <input type="text" id="envioTelefono" placeholder="Teléfono" class="input-form">
            <input type="text" id="envioDireccion" placeholder="Dirección" class="input-form">
            <input type="text" id="envioLocalidad" placeholder="Localidad" class="input-form">
            <input type="text" id="envioCP" placeholder="Código Postal" class="input-form">
        </div>

        <button class="btn-pagar" style="margin-top: 20px; background: #28a745;" onclick="procesarPagoCarrito()">Pagar Pedido Completo</button>
    </div>
</div>

<script>
    window.carritoQuoteIds = [];

    async function realizarCotizacion() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Seleccioná un archivo");

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("material", document.getElementById('materialInput').value);
        formData.append("espesor", document.getElementById('espesorInput').value);

        const res = await fetch('/cotizar', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
            window.carritoQuoteIds.push(data.quote_id);
            const tbody = document.querySelector("#tablaCarrito tbody");
            
            // Creamos una nueva fila
            const row = document.createElement("tr");
            row.innerHTML = `
                <td><div class="preview-svg">${data.svg_preview || 'No disponible'}</div></td>
                <td>${data.archivo}</td>
                <td>$${data.total_estimado}</td>
            `;
            tbody.appendChild(row);
            
            document.getElementById('finalizar-pedido').style.display = 'block';
        } else {
            alert("Error: " + data.detail);
        }
    }

    function toggleCamposEnvio() {
        const tipo = document.querySelector('input[name="tipoEnvio"]:checked').value;
        document.getElementById('seccion-direccion').style.display = (tipo === 'retiro') ? 'none' : 'block';
    }

    async function procesarPagoCarrito() {
        const tipoEnvio = document.querySelector('input[name="tipoEnvio"]:checked').value;
        const formData = new FormData();
        
        formData.append("item_ids", window.carritoQuoteIds.join(","));
        formData.append("tipo_envio", tipoEnvio);
        
        if (tipoEnvio !== 'retiro') {
            formData.append("nombre_envio", document.getElementById("envioNombre").value);
            formData.append("telefono_envio", document.getElementById("envioTelefono").value);
            formData.append("direccion_envio", document.getElementById("envioDireccion").value);
            formData.append("localidad_envio", document.getElementById("envioLocalidad").value);
            formData.append("cp_envio", document.getElementById("envioCP").value);
        }

        const res = await fetch('/crear_pago_carrito', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (res.ok) {
            window.location.href = data.init_point;
        } else {
            alert("Error: " + data.detail);
        }
    }
</script>

</body>
</html>
