<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDMAX Laser - Cotizador y Carrito</title>
    <!-- Estilos de tu proyecto -->
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        .opciones-envio label { display: block; margin: 10px 0; cursor: pointer; }
        .input-form { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-pagar { background: #009ee3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
        .btn-pagar:hover { background: #0082be; }
    </style>
</head>
<body>

<div class="container">
    <h2>Finalizar Pedido de Corte</h2>

    <!-- Sección de selección de tipo de envío -->
    <div class="opciones-envio">
        <h3>Seleccioná el método de entrega:</h3>
        <label>
            <input type="radio" name="tipoEnvio" value="retiro" checked onchange="toggleCamposEnvio()"> 
            Retiro por el taller (Gratis - Campana)
        </label>
        <label>
            <input type="radio" name="tipoEnvio" value="local" onchange="toggleCamposEnvio()"> 
            Envío Local / GBA ($5.000)
        </label>
        <label>
            <input type="radio" name="tipoEnvio" value="correo" onchange="toggleCamposEnvio()"> 
            Correo Argentino - Todo el país ($12.000)
        </label>
    </div>

    <!-- Formulario de dirección (Oculto por defecto si es retiro) -->
    <div id="seccion-direccion" style="display: none; margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
        <h3>Datos de Envío</h3>
        <input type="text" id="envioNombre" placeholder="Nombre y Apellido" class="input-form">
        <input type="text" id="envioTelefono" placeholder="Teléfono de contacto (Ej: 3489...)" class="input-form">
        <input type="text" id="envioDireccion" placeholder="Calle, Número, Piso/Depto" class="input-form">
        <input type="text" id="envioLocalidad" placeholder="Localidad / Partido / Provincia" class="input-form">
        <input type="text" id="envioCP" placeholder="Código Postal" class="input-form">
    </div>

    <!-- Botón para procesar el pago -->
    <button type="button" class="btn-pagar" onclick="procesarPagoCarrito()">Pagar con Mercado Pago</button>
</div>

<script>
    // Función para mostrar u ocultar el formulario según la opción elegida
    function toggleCamposEnvio() {
        const tipo = document.querySelector('input[name="tipoEnvio"]:checked').value;
        const seccionDir = document.getElementById('seccion-direccion');
        
        if (tipo === 'retiro') {
            seccionDir.style.display = 'none';
        } else {
            seccionDir.style.display = 'block';
        }
    }

    // Función que recopila los datos, valida (si es envío) y llama al backend
    async function procesarPagoCarrito() {
        // Obtenemos los IDs de las cotizaciones actuales en tu carrito (ejemplo de array de IDs)
        // Asegurate de reemplazar esto con tu lógica real donde guardás los quote_ids del carrito
        const idsDeCotizaciones = window.carritoQuoteIds || []; 

        if (idsDeCotizaciones.length === 0) {
            alert("El carrito está vacío o no hay archivos cotizados.");
            return;
        }

        const tipoEnvio = document.querySelector('input[name="tipoEnvio"]:checked').value;
        
        // Validar campos obligatorios si elige envío
        let nombre = "", telefono = "", direccion = "", localidad = "", cp = "";
        
        if (tipoEnvio !== 'retiro') {
            nombre = document.getElementById("envioNombre").value.trim();
            telefono = document.getElementById("envioTelefono").value.trim();
            direccion = document.getElementById("envioDireccion").value.trim();
            localidad = document.getElementById("envioLocalidad").value.trim();
            cp = document.getElementById("envioCP").value.trim();

            if (!nombre || !telefono || !direccion || !localidad || !cp) {
                alert("Por favor, completá todos los datos de envío antes de continuar.");
                return;
            }
        }

        // Armamos el FormData para enviar a tu API en FastAPI
        const formData = new FormData();
        formData.append("item_ids", idsDeCotizaciones.join(","));
        formData.append("tipo_envio", tipoEnvio);
        formData.append("nombre_envio", nombre);
        formData.append("telefono_envio", telefono);
        formData.append("direccion_envio", direccion);
        formData.append("localidad_envio", localidad);
        formData.append("cp_envio", cp);

        try {
            const response = await fetch('/crear_pago_carrito', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.init_point) {
                // Redirige al checkout de Mercado Pago
                window.location.href = data.init_point;
            } else {
                alert("Error al generar el pago: " + (data.detail || "Intente nuevamente."));
            }
        } catch (error) {
            console.error("Error de conexión:", error);
            alert("Ocurrió un error al conectar con el servidor de pagos.");
        }
    }
</script>

</body>
</html>
